<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プランカテゴリー詳細｜葉月フォトグラファー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --mist:#f2efe8;
    --ink:#1c1c1a;
    --teal:#2f5349;
    --teal-deep:#213c34;
    --stone:#8d897d;
    --line:rgba(28,28,26,0.1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:400; line-height:1.9; -webkit-font-smoothing:antialiased;
    opacity:0; transition:opacity .3s ease;
  }
  body.ready{opacity:1;}
  .en{font-family:'Poppins', sans-serif;}
  .mincho{font-family:'Shippori Mincho', serif;}
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 40px;}

  header{
    display:flex; align-items:center; padding:20px 40px; border-bottom:1px solid var(--line);
  }
  .logo{display:flex; align-items:center; gap:12px;}
  .logo svg{width:30px; height:30px; flex-shrink:0;}
  .logo .en{font-size:11px; letter-spacing:0.1em; color:var(--stone); display:block;}
  .logo .name{font-size:18px; font-weight:600;}

  main{padding:56px 0 100px;}
  .back-link{
    display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--stone);
    margin-bottom:30px;
  }
  .back-link:hover{color:var(--ink);}

  .cat-tag{
    display:inline-block; font-size:12.5px; font-weight:700; color:var(--teal-deep); background:var(--mist);
    padding:6px 16px; border-radius:100px; margin-bottom:18px;
  }
  .cat-heading{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:22px;}
  .cat-heading h1{font-family:'Shippori Mincho',serif; font-size:clamp(26px,4vw,36px); font-weight:700;}
  .cat-heading .en{font-size:14px; color:var(--stone); letter-spacing:0.1em;}
  .cat-photo{width:100%; aspect-ratio:16/7; overflow:hidden; margin-bottom:32px; border-radius:4px; background:var(--mist);}
  .cat-photo img{width:100%; height:100%; object-fit:cover;}
  .cat-intro{background:var(--mist); border-radius:12px; padding:26px 30px; font-size:14.5px; color:#3f3c34; margin-bottom:20px; max-width:720px;}
  .cat-intro b{color:var(--teal-deep);}
  .cat-notes{border-left:3px solid var(--teal); padding:20px 0 20px 24px; margin:20px 0 44px;}
  .cat-notes p{font-size:13px; color:var(--stone); margin-bottom:8px;}

  .plans-heading{font-size:18px; font-weight:700; margin-bottom:22px;}
  .plans{display:grid; grid-template-columns:repeat(3,1fr); gap:28px;}
  .plans.two-col{grid-template-columns:repeat(2,1fr);}
  .plan{background:#fff; display:block; text-decoration:none; color:inherit; transition:opacity .2s ease; border-radius:4px;}
  .plan:hover{opacity:0.82;}
  .plan.featured{background:var(--mist);}
  .plan.featured:hover{opacity:0.9;}
  .plan-head{padding:8px 4px 24px;}
  .plan.featured .plan-head{padding:28px 24px 24px;}
  .plan-tag{
    display:inline-block; font-size:12px; font-weight:700; color:var(--teal-deep); background:var(--mist);
    padding:5px 14px; border-radius:100px; margin-bottom:16px; width:fit-content;
  }
  .plan.featured .plan-tag{background:#fff;}
  .plan-title{font-size:18px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px; justify-content:space-between;}
  .plan-title .badge{font-size:12px; font-weight:700; color:var(--teal); text-decoration:underline;}
  .plan-title-text{display:flex; align-items:center; gap:8px;}
  .plan-toggle{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--teal-deep);
    background:#fff;
  }
  .plan.featured .plan-toggle{background:var(--teal); color:#fff; border-color:var(--teal);}
  .plan-price{font-family:'Poppins',sans-serif; font-size:28px; font-weight:700; color:var(--teal-deep); margin-bottom:16px;}
  .plan-desc{font-size:13px; color:var(--stone); line-height:1.8; margin-bottom:18px;}
  .plan-meta{border-top:1px solid var(--line); padding-top:14px; display:flex; flex-direction:column; gap:6px;}
  .plan-meta div{display:flex; align-items:baseline; gap:8px; font-size:12.5px;}
  .plan-meta .m-label{color:var(--stone); flex-shrink:0; min-width:64px;}
  .plan-meta .m-value{color:#3f3c34; font-weight:600;}

  .cta-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:44px;}
  .pill-btn{
    display:inline-flex; align-items:center; gap:10px; background:var(--teal); color:#fff; font-weight:600;
    font-size:14px; padding:15px 30px; border-radius:100px;
  }
  .pill-btn:hover{background:var(--teal-deep);}
  .pill-btn .arrow{width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:12px;}
  .pill-btn-ghost{
    display:inline-flex; align-items:center; gap:10px; background:#fff; color:var(--ink); font-weight:600;
    font-size:14px; padding:15px 30px; border-radius:100px; border:1.5px solid var(--line);
  }
  .pill-btn-ghost:hover{border-color:var(--stone);}

  .not-found{padding:100px 40px; text-align:center;}
  .not-found h1{font-size:22px; margin-bottom:14px;}
  .not-found p{color:var(--stone); font-size:14px; margin-bottom:26px;}

  @media (max-width:760px){
    .plans{grid-template-columns:1fr; gap:20px;}
  }
  @media (max-width:600px){
    .wrap{padding:0 22px;}
    header{padding:16px 22px;}
  }
</style>
</head>
<body>

<header>
  <a href="./index.html" class="logo">
    <svg viewBox="0 0 40 40" fill="none"><rect x="4" y="12" width="32" height="22" rx="3" stroke="#1c1c1a" stroke-width="1.6"/><circle cx="20" cy="23" r="7" stroke="#1c1c1a" stroke-width="1.6"/><rect x="13" y="8" width="8" height="5" rx="1" stroke="#1c1c1a" stroke-width="1.6"/></svg>
    <span>
      <span class="en" id="logoLabel">Photographer</span>
      <span class="name en" id="logoName">Hazuki</span>
    </span>
  </a>
</header>

<main>
  <div class="wrap" id="content"></div>
</main>

<script src="./data.js"></script>
<script>
async function render() {
  const contentEl = document.getElementById('content');
  try {
    const c = await loadContent();
    document.getElementById('logoLabel').textContent = c.brand.logoLabel;
    document.getElementById('logoName').textContent = c.brand.nameEn;

    const params = new URLSearchParams(window.location.search);
    const catKey = params.get('cat');
    const cat = c.planCategories.find(x => x.key === catKey);

    if (!cat) {
      contentEl.innerHTML = `
        <div class="not-found">
          <h1>カテゴリーが見つかりませんでした</h1>
          <p>URLが正しくないか、カテゴリーが削除された可能性があります。</p>
          <a href="./index.html#plans" class="pill-btn">プラン一覧へ戻る<span class="arrow">→</span></a>
        </div>`;
      document.body.classList.add('ready');
      return;
    }

    contentEl.innerHTML = `
      <a href="./index.html#plans" class="back-link">← プラン一覧へ戻る</a>
      <div class="cat-tag">${escapeHtml(cat.label)}</div>
      <div class="cat-heading">
        <h1 class="mincho">${escapeHtml(cat.label)}</h1>
        <span class="en">${escapeHtml(cat.labelEn || '')}</span>
      </div>
      <div class="cat-photo"><img src="${cat.photo}" alt="${escapeHtml(cat.label)}"></div>
      <div class="cat-intro">${cat.intro}</div>
      <div class="cat-notes">${cat.notes.map(n => `<p>※ ${escapeHtml(n)}</p>`).join('')}</div>

      <div class="plans-heading">料金プラン</div>
      <div class="plans ${cat.plans.length===2?'two-col':''}">
        ${cat.plans.map((p, pi) => `
          <a class="plan ${p.popular?'featured':''}" href="./plan-detail.html?cat=${encodeURIComponent(cat.key)}&plan=${pi}">
            <div class="plan-head">
              <div class="plan-tag">${escapeHtml(cat.label)}</div>
              <div class="plan-title">
                <span class="plan-title-text">${escapeHtml(p.name)}${p.popular?'<span class="badge">1番人気</span>':''}</span>
                <span class="plan-toggle">→</span>
              </div>
              <div class="plan-price">${escapeHtml(p.price)}</div>
              <div class="plan-desc">${escapeHtml(p.desc)}</div>
              <div class="plan-meta">
                <div><span class="m-label">撮影時間</span><span class="m-value">${escapeHtml(p.duration)}</span></div>
                <div><span class="m-label">データ納品</span><span class="m-value">${escapeHtml(p.delivery)}</span></div>
              </div>
            </div>
          </a>`).join('')}
      </div>

      <div class="cta-row">
        <a href="./index.html#contact" class="pill-btn">プランについて相談する<span class="arrow">→</span></a>
        <a href="./index.html#plans" class="pill-btn-ghost">他のカテゴリーも見る</a>
      </div>
    `;
  } catch (e) {
    console.error(e);
    contentEl.innerHTML = `
      <div class="not-found">
        <h1>読み込みに失敗しました</h1>
        <a href="./index.html" class="pill-btn">トップへ戻る<span class="arrow">→</span></a>
      </div>`;
  } finally {
    document.body.classList.add('ready');
  }
}

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

render();
</script>

</body>
</html>
