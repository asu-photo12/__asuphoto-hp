<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>えり｜みつき｜フォトグラファー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --mist:#f2efe8;
    --ink:#1c1c1a;
    --teal:#2f5349;
    --teal-deep:#213c34;
    --stone:#8d897d;
    --line:rgba(28,28,26,0.1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:400;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    opacity:0; transition:opacity .3s ease;
  }
  body.ready{opacity:1;}
  .en{font-family:'Poppins', sans-serif;}
  .mincho{font-family:'Shippori Mincho', serif;}
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%;}
  .wrap{max-width:1240px; margin:0 auto; padding:0 40px;}
  ::selection{background:var(--teal); color:#fff;}

  header{
    display:flex; align-items:stretch; justify-content:space-between;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper); z-index:100;
  }
  .logo{display:flex; align-items:center; gap:12px; padding:18px 40px;}
  .logo svg{width:34px; height:34px; flex-shrink:0;}
  .logo .en{font-size:11px; letter-spacing:0.1em; color:var(--stone); display:block;}
  .logo .name{font-size:21px; font-weight:600;}
  nav{display:flex; align-items:center; gap:38px; padding:0 20px;}
  nav a{font-size:14px; font-weight:600; text-align:center;}
  nav a span{display:block; font-size:10.5px; font-weight:400; color:var(--stone); margin-top:2px; font-family:'Zen Kaku Gothic New',sans-serif;}
  .menu-btn{display:none; background:none; border:none; font-size:24px; cursor:pointer; padding:0 20px;}
  .contact-block{
    background:var(--teal); color:#fff; display:flex; align-items:center; gap:10px;
    padding:0 34px; font-weight:600; font-size:14px; white-space:nowrap;
  }
  .contact-block:hover{background:var(--teal-deep);}
  .contact-block .arrow{width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; font-size:14px;}

  .hero-photo{position:relative; height:78vh; min-height:520px; overflow:hidden; background:var(--mist);}
  .hero-photo img{width:100%; height:100%; object-fit:cover; filter:saturate(0.95) contrast(1.02);}
  .hero-copy{padding:52px 0 70px; position:relative;}
  .hero-copy .wrap{position:relative;}
  .hero-copy h1{
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:clamp(32px,5.4vw,68px);
    line-height:1.3; letter-spacing:0.01em; margin-bottom:26px; white-space:pre-line;
  }
  .hero-copy p{font-size:17px; color:#3a3a36; font-weight:500; white-space:pre-line;}

  section{padding:110px 0;}
  .eyebrow{font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.1em; color:var(--teal); margin-bottom:14px;}
  .section-title{font-size:clamp(26px,3vw,36px); font-weight:700; margin-bottom:18px; white-space:pre-line;}
  .section-lead{color:var(--stone); font-size:14.5px; max-width:520px; white-space:pre-line;}

  .profile{display:grid; grid-template-columns:0.85fr 1.15fr; gap:0; background:var(--mist); border-radius:2px; overflow:hidden;}
  .profile-photo{position:relative;}
  .profile-photo img{width:100%; height:100%; object-fit:cover; min-height:520px;}
  .profile-text{padding:70px 60px; display:flex; flex-direction:column; justify-content:center;}
  .profile-text .en-name{font-family:'Poppins',sans-serif; font-weight:700; font-size:clamp(34px,4vw,52px); margin:4px 0 18px;}
  .profile-text p{font-size:14.5px; color:#4b473d; max-width:440px; margin-bottom:14px; white-space:pre-line;}
  .pill-btn{
    display:inline-flex; align-items:center; gap:10px; background:var(--teal); color:#fff; font-weight:600;
    font-size:14px; padding:15px 30px; border-radius:100px; margin-top:20px; width:fit-content; border:none; cursor:pointer;
    font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .pill-btn:hover{background:var(--teal-deep);}
  .pill-btn .arrow{width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:12px;}

  .gallery-tabs{display:flex; gap:10px; flex-wrap:wrap; margin:30px 0 34px;}
  .tab-btn{
    font-size:13px; font-weight:600; padding:10px 20px; border-radius:100px; border:1px solid var(--line);
    background:#fff; cursor:pointer; color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .tab-btn.active{background:var(--ink); border-color:var(--ink); color:#fff;}
  .g-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:4px;}
  .g-card{position:relative; overflow:hidden; aspect-ratio:4/5;}
  .g-card img{width:100%; height:100%; object-fit:cover; transition:transform 1s cubic-bezier(.16,1,.3,1); filter:saturate(0.96);}
  .g-card:hover img{transform:scale(1.05);}
  .g-cap{
    position:absolute; left:0; right:0; bottom:0; padding:16px; color:#fff; font-size:13px;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.72) 100%);
    opacity:0; transition:opacity .3s ease;
  }
  .g-card:hover .g-cap{opacity:1;}
  .g-hide{display:none;}

  /* ---------- plan category grid (komatsubara-sota.com 風) ---------- */
  .cat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:32px 40px; margin-top:20px;}
  .cat-card{
    display:block; padding:0; text-align:center; cursor:pointer; background:transparent;
    transition:opacity .25s ease; text-decoration:none; color:inherit;
  }
  .cat-card:hover{opacity:0.85;}
  .cat-card h3{font-family:'Shippori Mincho',serif; font-weight:700; font-size:26px; letter-spacing:0.06em; margin-bottom:6px;}
  .cat-card .cat-en{font-family:'Poppins',sans-serif; font-weight:400; font-size:13px; letter-spacing:0.12em; color:var(--stone); margin-bottom:26px;}
  .cat-card .cat-photo{width:100%; aspect-ratio:5/3.4; overflow:hidden; margin-bottom:26px;}
  .cat-card .cat-photo img{width:100%; height:100%; object-fit:cover; transition:transform .8s cubic-bezier(.16,1,.3,1);}
  .cat-card:hover .cat-photo img{transform:scale(1.04);}
  .more-view{
    display:inline-flex; align-items:center; gap:8px; font-size:12.5px; letter-spacing:0.14em; color:var(--ink);
    padding-bottom:5px; border-bottom:1px solid var(--ink); font-family:'Zen Kaku Gothic New',sans-serif;
  }


  .plans{display:grid; grid-template-columns:repeat(3,1fr); gap:28px;}
  .plans.two-col{grid-template-columns:repeat(2,1fr);}
  .plan{background:#fff; display:block; text-decoration:none; color:inherit; transition:opacity .2s ease; border-radius:4px;}
  .plan:hover{opacity:0.82;}
  .plan.featured{background:var(--mist);}
  .plan.featured:hover{opacity:0.9;}
  .plan-head{padding:8px 4px 24px;}
  .plan.featured .plan-head{padding:28px 24px 24px;}
  .plan-tag{
    display:inline-block; font-size:12px; font-weight:700; color:var(--teal-deep); background:var(--mist);
    padding:5px 14px; border-radius:100px; margin-bottom:16px; width:fit-content;
  }
  .plan.featured .plan-tag{background:#fff;}
  .plan-title{font-size:18px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px; justify-content:space-between;}
  .plan-title .badge{font-size:12px; font-weight:700; color:var(--teal); text-decoration:underline;}
  .plan-title-text{display:flex; align-items:center; gap:8px;}
  .plan-toggle{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--teal-deep);
    background:#fff;
  }
  .plan.featured .plan-toggle{background:var(--teal); color:#fff; border-color:var(--teal);}
  .plan-price{font-family:'Poppins',sans-serif; font-size:28px; font-weight:700; color:var(--teal-deep);}
  .plan-hint{font-size:12px; color:var(--stone); padding:0 30px 26px; margin-top:12px;}
  .plan.featured .plan-hint{color:#5c7268;}

  .voices{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:36px;}
  .voice{border-top:2px solid var(--ink); padding-top:20px;}
  .voice p{font-size:14px; color:#4b473d; margin-bottom:16px;}
  .voice .who{font-family:'Poppins',sans-serif; font-size:12.5px; font-weight:600; color:var(--stone);}
  .voices-more-wrap{margin-top:36px; text-align:center;}

  .faq-list{margin-top:36px; display:flex; flex-direction:column; gap:24px;}
  .faq-category-card{background:#fff; border-radius:14px; padding:32px 30px;}
  .faq-category-title{
    font-size:19px; font-weight:700; display:inline-block; padding-bottom:9px;
    border-bottom:2px solid var(--ink); margin-bottom:6px;
  }
  .faq-item{border-bottom:1px solid var(--line);}
  .faq-item:last-child{border-bottom:none;}
  .faq-q-row{
    display:flex; align-items:center; gap:14px; padding:18px 2px; cursor:pointer; background:none; border:none;
    width:100%; text-align:left; font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .faq-mark{
    font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; flex-shrink:0;
    width:20px; color:var(--teal);
  }
  .faq-question{flex:1; font-size:13.5px; font-weight:700; color:var(--ink); line-height:1.7; overflow-wrap:break-word; word-break:keep-all;}
  .faq-chevron{flex-shrink:0; font-size:11px; color:var(--stone); transition:transform .25s ease;}
  .faq-item.open .faq-chevron{transform:rotate(180deg); color:var(--teal);}
  .faq-answer-wrap{max-height:0; overflow:hidden; transition:max-height .35s cubic-bezier(.16,1,.3,1);}
  .faq-answer{
    padding:0 2px 20px 34px; font-size:12.5px; color:#4b473d; line-height:1.9;
    white-space:pre-line; overflow-wrap:break-word; word-break:keep-all;
  }

  .contact-section{background:var(--teal); color:#fff;}
  .contact-grid{display:grid; grid-template-columns:1fr 1fr; gap:60px;}
  .contact-grid h2{font-size:clamp(26px,3vw,36px); font-weight:700; margin-bottom:18px;}
  .contact-grid p{opacity:0.86; font-size:14.5px; max-width:380px; white-space:pre-line;}
  .contact-links{margin-top:28px; display:flex; flex-direction:column; gap:12px; font-size:14px; font-weight:600;}
  .contact-link-icon{display:inline-flex; align-items:center; gap:9px;}
  .contact-link-icon svg{width:18px; height:18px; flex-shrink:0;}
  form{display:flex; flex-direction:column; gap:12px;}
  form input, form textarea{
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); border-radius:4px;
    color:#fff; font-family:'Zen Kaku Gothic New',sans-serif; font-size:14px; padding:14px 16px;
  }
  form input::placeholder, form textarea::placeholder{color:rgba(255,255,255,0.65);}
  form input:focus, form textarea:focus{outline:none; border-color:#fff;}
  form textarea{resize:none; height:80px;}
  form button{
    margin-top:6px; background:#fff; color:var(--teal-deep); border:none; border-radius:100px;
    padding:15px 30px; font-weight:700; font-size:14px; cursor:pointer; width:fit-content;
  }
  form button:hover{opacity:0.9;}

  footer{padding:34px 0; text-align:center; font-size:12px; color:var(--stone);}

  @media (max-width:940px){
    nav{display:none;}
    .menu-btn{display:block;}
    .profile{grid-template-columns:1fr;}
    .profile-photo img{min-height:340px;}
    .plans{grid-template-columns:1fr 1fr;}
    .g-grid{grid-template-columns:repeat(4,1fr);}
    .voices{grid-template-columns:1fr;}
    .contact-grid{grid-template-columns:1fr;}
    section{padding:70px 0;}
    .wrap{padding:0 22px;}
    .cat-grid{gap:26px 30px;}
  }
  @media (max-width:560px){
    .plans{grid-template-columns:1fr;}
    .g-grid{grid-template-columns:repeat(2,1fr);}
    .cat-grid{grid-template-columns:1fr; gap:34px;}

    html{font-size:15px;}
    .wrap{padding:0 18px;}
    section{padding:52px 0;}

    /* header */
    .logo{padding:14px 18px; gap:9px;}
    .logo svg{width:28px; height:28px;}
    .logo .en{font-size:9.5px;}
    .logo .name{font-size:16px;}
    .contact-block{padding:0 18px; font-size:12.5px;}
    .contact-block .arrow{width:22px; height:22px; font-size:12px;}

    /* hero */
    .hero-photo{height:46vh; min-height:300px;}
    .hero-copy{padding:32px 0 44px;}
    .hero-copy h1{font-size:clamp(23px,7.4vw,32px); line-height:1.5; letter-spacing:0; margin-bottom:16px; overflow-wrap:break-word; word-break:keep-all;}
    .hero-copy p{font-size:13.5px; line-height:1.75;}

    /* section heads */
    .eyebrow{font-size:11px; margin-bottom:10px;}
    .section-title{font-size:clamp(19px,5.6vw,24px); line-height:1.45; margin-bottom:12px; overflow-wrap:break-word; word-break:keep-all;}
    .section-lead{font-size:12.5px; line-height:1.8;}

    /* profile */
    .profile-photo img{min-height:220px;}
    .profile-text{padding:28px 22px;}
    .profile-text .en-name{font-size:clamp(23px,7vw,30px); margin:2px 0 12px;}
    .profile-text p{font-size:12.5px; line-height:1.85; margin-bottom:10px;}
    .pill-btn{font-size:12.5px; padding:12px 22px; margin-top:14px;}
    .pill-btn .arrow{width:18px; height:18px; font-size:11px;}

    /* plan category cards */
    .cat-card h3{font-size:19px; line-height:1.4; overflow-wrap:break-word; word-break:keep-all;}
    .cat-card .cat-en{font-size:10.5px; margin-bottom:16px;}
    .more-view{font-size:11px;}

    .plans{gap:20px;}
    .plan-head{padding:4px 2px 16px;}
    .plan.featured .plan-head{padding:20px 18px 16px;}
    .plan-tag{font-size:10.5px; padding:4px 12px; margin-bottom:10px;}
    .plan-title{font-size:15px; margin-bottom:8px;}
    .plan-toggle{width:22px; height:22px; font-size:12px;}
    .plan-price{font-size:21px;}
    .plan-hint{font-size:10.5px; padding:0 20px 18px; margin-top:8px;}

    /* gallery */
    .gallery-tabs{gap:7px; margin:18px 0 20px;}
    .tab-btn{font-size:11.5px; padding:8px 14px;}
    .g-cap{font-size:11.5px; padding:12px;}

    /* voices */
    .voices{gap:20px; margin-top:22px;}
    .voice{padding-top:14px;}
    .voice p{font-size:12.5px; line-height:1.85; margin-bottom:12px;}
    .voice .who{font-size:11px;}

    /* contact */
    .contact-grid{gap:30px;}
    .contact-grid h2{font-size:clamp(19px,6vw,24px); line-height:1.5; margin-bottom:12px; overflow-wrap:break-word; word-break:keep-all;}
    .contact-grid p{font-size:12.5px; line-height:1.85;}
    .contact-links{margin-top:18px; gap:9px; font-size:12.5px;}
    form{gap:9px;}
    form input, form textarea{font-size:12.5px; padding:11px 13px;}
    form button{font-size:12.5px; padding:12px 22px;}

    footer{padding:24px 0; font-size:11px;}
  }
</style>
</head>
<body>

<header>
  <a href="#top" class="logo">
    <svg viewBox="0 0 40 40" fill="none"><rect x="4" y="12" width="32" height="22" rx="3" stroke="#1c1c1a" stroke-width="1.6"/><circle cx="20" cy="23" r="7" stroke="#1c1c1a" stroke-width="1.6"/><rect x="13" y="8" width="8" height="5" rx="1" stroke="#1c1c1a" stroke-width="1.6"/></svg>
    <span>
      <span class="en" id="logoLabel">Photographer</span>
      <span class="name en" id="logoName">Eri</span>
    </span>
  </a>
  <nav>
    <a href="#profile">Profile<span>プロフィール</span></a>
    <a href="#plans">Plan/Price<span>撮影プラン/料金</span></a>
    <a href="#works">Gallery<span>ギャラリー</span></a>
    <a href="#contact">Contact<span>お問い合わせ</span></a>
  </nav>
  <button class="menu-btn">☰</button>
  <a href="#contact" class="contact-block">Contact<span class="arrow">→</span></a>
</header>

<div id="top">
  <div class="hero-photo">
    <img id="heroPhoto" src="" alt="ヒーロー写真">
  </div>
  <div class="hero-copy">
    <div class="wrap">
      <h1 id="heroHeadline"></h1>
      <p id="heroSub"></p>
    </div>
  </div>
</div>

<section id="profile">
  <div class="wrap">
    <div class="profile">
      <div class="profile-photo">
        <img id="profilePhoto" src="" alt="プロフィール写真">
      </div>
      <div class="profile-text">
        <div class="eyebrow" id="profileEyebrow">PROFILE</div>
        <div class="en-name en" id="profileEnName"></div>
        <p id="profileBody1"></p>
        <p id="profileBody2"></p>
        <a href="#works" class="pill-btn">View More<span class="arrow">→</span></a>
      </div>
    </div>
  </div>
</section>

<section id="plans" style="background:var(--mist);">
  <div class="wrap">
    <div class="eyebrow" id="planEyebrow">PLAN / PRICE</div>
    <h2 class="section-title" id="planTitle">撮影プラン / 料金</h2>
    <div class="cat-grid" id="planCatGrid"></div>
    <a href="#contact" class="pill-btn" style="margin-top:36px;"><span id="planCtaLabel">プランについて相談する</span><span class="arrow">→</span></a>
  </div>
</section>

<section id="works">
  <div class="wrap">
    <div class="eyebrow" id="galleryEyebrow">GALLERY</div>
    <h2 class="section-title" id="galleryTitle">ギャラリー</h2>
    <p class="section-lead" id="galleryLead"></p>
    <div class="gallery-tabs" id="tabs"></div>
    <div class="g-grid" id="grid"></div>
  </div>
</section>

<section id="voices">
  <div class="wrap">
    <div class="eyebrow" id="voicesEyebrow">VOICE</div>
    <h2 class="section-title" id="voicesTitle">お客様の声</h2>
    <div class="voices" id="voicesGrid"></div>
    <div class="voices-more-wrap" id="voicesMoreWrap" style="display:none;">
      <a href="./voices.html" class="more-view en">more view &gt;&gt;</a>
    </div>
  </div>
</section>

<section id="faq" style="background:var(--mist);">
  <div class="wrap">
    <div class="eyebrow" id="faqEyebrow">FAQ</div>
    <h2 class="section-title" id="faqTitle">よくある質問</h2>
    <div class="faq-list" id="faqList"></div>
  </div>
</section>

<section id="terms">
  <div class="wrap">
    <div class="eyebrow" id="termsEyebrow">TERMS</div>
    <h2 class="section-title" id="termsTitle">ご利用規約</h2>
    <p class="section-lead" id="termsLead"></p>
    <a href="./terms.html" class="more-view en" id="termsLink" style="margin-top:26px;">詳しくはこちらをご覧ください</a>
  </div>
</section>

<section id="contact" class="contact-section">
  <div class="wrap contact-grid">
    <div>
      <h2 id="contactHeading"></h2>
      <p id="contactBody"></p>
      <div class="contact-links" id="contactLinks"></div>
    </div>
    <form onsubmit="event.preventDefault(); alert('送信しました。追ってご連絡いたします。');">
      <input type="text" placeholder="お名前" required>
      <input type="email" placeholder="メールアドレス" required>
      <input type="text" placeholder="ご希望プラン（任意）">
      <textarea placeholder="撮影のご希望内容"></textarea>
      <button type="submit">送信する</button>
    </form>
  </div>
</section>

<footer>
  <div class="wrap" id="footerText"></div>
</footer>


<script>
/* フォールバック: このチャット内プレビューなど、外部の data.js を
   読み込めない環境でも表示できるよう、同じ内容を埋め込んでいます。
   公開サイトで外部の data.js が正常に読み込めた場合は、
   そちらの内容で自動的に上書きされます。 */
/* ============================================================
   共有データモデル
   このサイトと管理サイトは window.storage の同じキー
   ("site-content", shared=true) を読み書きすることで同期します。
   ここにあるオブジェクトは「まだ一度も保存されていないときの初期値」です。
   ============================================================ */

var STORAGE_KEY = "site-content";

var DEFAULT_CONTENT = {
  brand: {
    nameEn: "Eri",
    nameJa: "えり",
    logoLabel: "Photographer"
  },
  hero: {
    photo: "https://picsum.photos/seed/eri-hero-warm/1800/1000",
    headline: "特別な日だけじゃない、\nいつもの幸せを。",
    sub: "何年経っても色褪せない思い出を形に。"
  },
  profile: {

/* 保存されている内容を取得。無ければデフォルトを返す */
async function loadContent() {
  try {
    if (!window.storage) throw new Error("storage unavailable");
    const result = await window.storage.get(STORAGE_KEY, true);
    if (result && result.value) {
      const saved = JSON.parse(result.value);
      // デフォルトとマージして、新しく追加された項目が欠けないようにする
      return deepMerge(structuredClone(DEFAULT_CONTENT), saved);
    }
  } catch (e) {
    console.log("保存データが見つからないため初期値を使用します", e);
  }
  return structuredClone(DEFAULT_CONTENT);
}

async function saveContent(content) {
  if (!window.storage) {
    throw new Error("この画面ではデータの保存機能が使えません（Claudeのアーティファクトとして開いた場合にのみ保存できます）");
  }
  return await window.storage.set(STORAGE_KEY, JSON.stringify(content), true);
}

function deepMerge(base, override) {
  if (Array.isArray(base)) return Array.isArray(override) ? override : base;
  if (typeof base === "object" && base !== null) {
    const out = { ...base };
    for (const k in override || {}) {
      out[k] = deepMerge(base[k], override[k]);
    }
    return out;
  }
  return override !== undefined ? override : base;
}

    try { renderContent(structuredClone(DEFAULT_CONTENT)); } catch(e2) { console.error(e2); }
  } finally {
    document.body.classList.add('ready');
  }
}

  renderPlanCatGrid();

  // gallery

    </div>`).join('');

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
