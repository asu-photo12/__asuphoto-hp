<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プラン詳細｜葉月フォトグラファー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --mist:#f2efe8;
    --ink:#1c1c1a;
    --teal:#2f5349;
    --teal-deep:#213c34;
    --stone:#8d897d;
    --line:rgba(28,28,26,0.1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:400; line-height:1.9; -webkit-font-smoothing:antialiased;
    opacity:0; transition:opacity .3s ease;
  }
  body.ready{opacity:1;}
  .en{font-family:'Poppins', sans-serif;}
  .mincho{font-family:'Shippori Mincho', serif;}
  a{color:inherit; text-decoration:none;}
  img{display:block; max-width:100%;}
  .wrap{max-width:820px; margin:0 auto; padding:0 40px;}

  header{
    display:flex; align-items:center; padding:20px 40px; border-bottom:1px solid var(--line);
  }
  .logo{display:flex; align-items:center; gap:12px;}
  .logo svg{width:30px; height:30px; flex-shrink:0;}
  .logo .en{font-size:11px; letter-spacing:0.1em; color:var(--stone); display:block;}
  .logo .name{font-size:18px; font-weight:600;}

  main{padding:60px 0 100px;}
  .back-link{
    display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--stone);
    margin-bottom:34px;
  }
  .back-link:hover{color:var(--ink);}

  .detail-tag{
    display:inline-block; font-size:12.5px; font-weight:700; color:var(--teal-deep); background:var(--mist);
    padding:6px 16px; border-radius:100px; margin-bottom:18px;
  }
  .detail-title{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:8px;}
  .detail-title h1{font-size:clamp(26px,4vw,36px); font-weight:700;}
  .detail-title .badge{
    font-size:12.5px; font-weight:700; color:#fff; background:var(--teal); padding:5px 14px; border-radius:100px;
  }
  .detail-photo{width:100%; aspect-ratio:16/9; overflow:hidden; margin:28px 0; border-radius:4px; background:var(--mist);}
  .detail-photo img{width:100%; height:100%; object-fit:cover;}
  .detail-price{font-family:'Poppins',sans-serif; font-size:38px; font-weight:700; color:var(--teal-deep); margin:20px 0 26px;}
  .detail-desc{font-size:15.5px; color:#3f3c34; margin-bottom:30px; max-width:600px;}
  .detail-meta{
    display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line);
    margin-bottom:34px;
  }
  .detail-meta div{background:#fff; padding:22px 24px;}
  .detail-meta .m-label{font-size:12px; color:var(--stone); margin-bottom:6px; letter-spacing:0.04em;}
  .detail-meta .m-value{font-size:16px; font-weight:700;}
  .detail-intro{background:var(--mist); border-radius:12px; padding:24px 28px; font-size:14.5px; color:#3f3c34; margin-bottom:20px;}
  .detail-intro b{color:var(--teal-deep);}
  .detail-notes{border-left:3px solid var(--teal); padding:18px 0 18px 22px; margin-bottom:40px;}
  .detail-notes p{font-size:13px; color:var(--stone); margin-bottom:8px;}

  .cta-row{display:flex; gap:14px; flex-wrap:wrap;}
  .pill-btn{
    display:inline-flex; align-items:center; gap:10px; background:var(--teal); color:#fff; font-weight:600;
    font-size:14px; padding:15px 30px; border-radius:100px;
  }
  .pill-btn:hover{background:var(--teal-deep);}
  .pill-btn .arrow{width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:12px;}
  .pill-btn-ghost{
    display:inline-flex; align-items:center; gap:10px; background:#fff; color:var(--ink); font-weight:600;
    font-size:14px; padding:15px 30px; border-radius:100px; border:1.5px solid var(--line);
  }
  .pill-btn-ghost:hover{border-color:var(--stone);}

  .not-found{padding:100px 40px; text-align:center;}
  .not-found h1{font-size:22px; margin-bottom:14px;}
  .not-found p{color:var(--stone); font-size:14px; margin-bottom:26px;}

  @media (max-width:600px){
    .wrap{padding:0 22px;}
    header{padding:16px 22px;}
    .detail-meta{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <a href="./index.html" class="logo">
    <svg viewBox="0 0 40 40" fill="none"><rect x="4" y="12" width="32" height="22" rx="3" stroke="#1c1c1a" stroke-width="1.6"/><circle cx="20" cy="23" r="7" stroke="#1c1c1a" stroke-width="1.6"/><rect x="13" y="8" width="8" height="5" rx="1" stroke="#1c1c1a" stroke-width="1.6"/></svg>
    <span>
      <span class="en" id="logoLabel">Photographer</span>
      <span class="name en" id="logoName">Hazuki</span>
    </span>
  </a>
</header>

<main>
  <div class="wrap" id="content"></div>
</main>

<script src="./data.js"></script>
<script>
async function render() {
  const contentEl = document.getElementById('content');
  try {
    const c = await loadContent();
    document.getElementById('logoLabel').textContent = c.brand.logoLabel;
    document.getElementById('logoName').textContent = c.brand.nameEn;

    const params = new URLSearchParams(window.location.search);
    const catKey = params.get('cat');
    const planIndex = parseInt(params.get('plan'), 10);
    const cat = c.planCategories.find(x => x.key === catKey);
    const plan = cat && !isNaN(planIndex) ? cat.plans[planIndex] : null;

    if (!cat || !plan) {
      contentEl.innerHTML = `
        <div class="not-found">
          <h1>プランが見つかりませんでした</h1>
          <p>URLが正しくないか、プランが削除された可能性があります。</p>
          <a href="./index.html#plans" class="pill-btn">プラン一覧へ戻る<span class="arrow">→</span></a>
        </div>`;
      document.body.classList.add('ready');
      return;
    }

    contentEl.innerHTML = `
      <a href="./index.html#plans" class="back-link">← ${escapeHtml(cat.label)}のプラン一覧へ戻る</a>
      <div class="detail-tag">${escapeHtml(cat.label)} ${cat.labelEn ? '／ ' + escapeHtml(cat.labelEn) : ''}</div>
      <div class="detail-title">
        <h1 class="mincho">${escapeHtml(plan.name)}</h1>
        ${plan.popular ? '<span class="badge">1番人気</span>' : ''}
      </div>
      <div class="detail-photo"><img src="${cat.photo}" alt="${escapeHtml(cat.label)}"></div>
      <div class="detail-price en">${escapeHtml(plan.price)}</div>
      <div class="detail-desc">${escapeHtml(plan.desc)}</div>
      <div class="detail-meta">
        <div><div class="m-label">撮影時間</div><div class="m-value">${escapeHtml(plan.duration)}</div></div>
        <div><div class="m-label">データ納品</div><div class="m-value">${escapeHtml(plan.delivery)}</div></div>
      </div>
      <div class="detail-intro">${cat.intro}</div>
      <div class="detail-notes">${cat.notes.map(n => `<p>※ ${escapeHtml(n)}</p>`).join('')}</div>
      <div class="cta-row">
        <a href="./index.html#contact" class="pill-btn">このプランで相談する<span class="arrow">→</span></a>
        <a href="./index.html#plans" class="pill-btn-ghost">他のプランも見る</a>
      </div>
    `;
  } catch (e) {
    console.error(e);
    contentEl.innerHTML = `
      <div class="not-found">
        <h1>読み込みに失敗しました</h1>
        <a href="./index.html" class="pill-btn">トップへ戻る<span class="arrow">→</span></a>
      </div>`;
  } finally {
    document.body.classList.add('ready');
  }
}

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

render();
</script>

</body>
</html>
