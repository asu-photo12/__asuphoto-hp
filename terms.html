/* 保存されている内容を取得。無ければデフォルトを返す */
async function loadContent() {
  try {
    if (!window.storage) throw new Error("storage unavailable");
    const result = await window.storage.get(STORAGE_KEY, true);
    if (result && result.value) {
      const saved = JSON.parse(result.value);
      // デフォルトとマージして、新しく追加された項目が欠けないようにする
      return deepMerge(structuredClone(DEFAULT_CONTENT), saved);
    }
  } catch (e) {
    console.log("保存データが見つからないため初期値を使用します", e);
  }
  return structuredClone(DEFAULT_CONTENT);
}

async function saveContent(content) {
  if (!window.storage) {
    throw new Error("この画面ではデータの保存機能が使えません（Claudeのアーティファクトとして開いた場合にのみ保存できます）");
  }
  return await window.storage.set(STORAGE_KEY, JSON.stringify(content), true);
}

function deepMerge(base, override) {
  if (Array.isArray(base)) return Array.isArray(override) ? override : base;
  if (typeof base === "object" && base !== null) {
    const out = { ...base };
    for (const k in override || {}) {
      out[k] = deepMerge(base[k], override[k]);
    }
    return out;
  }
  return override !== undefined ? override : base;
}

<script>
async function render() {
  try {
    const c = await loadContent();
    document.getElementById('logoLabel').textContent = c.brand.logoLabel;
    document.getElementById('logoName').textContent = c.brand.nameEn;
    document.getElementById('termsEyebrow').textContent = c.sections.terms.eyebrow;
    document.getElementById('termsTitle').textContent = c.sections.terms.title;

    document.getElementById('termsList').innerHTML = (c.termsSections || []).map(t => `
      <div class="term-card">
        <div class="term-title">${escapeHtml(t.title)}</div>
        <div class="term-body">${escapeHtml(t.body)}</div>
        ${(t.rows && t.rows.length) ? `
          <table class="term-table">
            ${t.rows.map(r => `<tr><td>${escapeHtml(r.label)}</td><td>${escapeHtml(r.value)}</td></tr>`).join('')}
          </table>` : ''}
      </div>`).join('');
  } catch (e) {
    console.error(e);
  } finally {
    document.body.classList.add('ready');
  }
}

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

render();
</script>
