<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ご利用規約｜葉月フォトグラファー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --mist:#f2efe8;
    --ink:#1c1c1a;
    --teal:#2f5349;
    --teal-deep:#213c34;
    --stone:#8d897d;
    --line:rgba(28,28,26,0.1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:400; line-height:1.9; -webkit-font-smoothing:antialiased;
    opacity:0; transition:opacity .3s ease;
  }
  body.ready{opacity:1;}
  .en{font-family:'Poppins', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:820px; margin:0 auto; padding:0 40px;}

  header{
    display:flex; align-items:center; padding:20px 40px; border-bottom:1px solid var(--line);
  }
  .logo{display:flex; align-items:center; gap:12px;}
  .logo svg{width:30px; height:30px; flex-shrink:0;}
  .logo .en{font-size:11px; letter-spacing:0.1em; color:var(--stone); display:block;}
  .logo .name{font-size:18px; font-weight:600;}

  main{padding:56px 0 100px;}
  .back-link{
    display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--stone);
    margin-bottom:30px;
  }
  .back-link:hover{color:var(--ink);}

  .eyebrow{font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.1em; color:var(--teal); margin-bottom:14px;}
  .page-title{font-size:clamp(26px,4vw,36px); font-weight:700; margin-bottom:48px;}

  .term-card{background:var(--mist); border-radius:14px; padding:32px 30px; margin-bottom:22px;}
  .term-title{
    font-size:18px; font-weight:700; display:inline-block; padding-bottom:9px;
    border-bottom:2px solid var(--ink); margin-bottom:22px;
  }
  .term-body{font-size:13.5px; color:#3f3c34; line-height:1.95; white-space:pre-line; overflow-wrap:break-word; word-break:keep-all; margin-bottom:22px;}
  .term-body:last-child{margin-bottom:0;}
  .term-table{width:100%; border-collapse:collapse; margin-top:6px;}
  .term-table tr{border-bottom:1px solid var(--line);}
  .term-table tr:last-child{border-bottom:none;}
  .term-table td{padding:12px 4px; font-size:13px;}
  .term-table td:first-child{color:var(--stone);}
  .term-table td:last-child{text-align:right; font-family:'Poppins',sans-serif; font-weight:700; color:var(--teal-deep);}

  .cta-row{margin-top:44px;}
  .pill-btn{
    display:inline-flex; align-items:center; gap:10px; background:var(--teal); color:#fff; font-weight:600;
    font-size:14px; padding:15px 30px; border-radius:100px;
  }
  .pill-btn:hover{background:var(--teal-deep);}
  .pill-btn .arrow{width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:12px;}

  @media (max-width:560px){
    .wrap{padding:0 22px;}
    header{padding:16px 22px;}
    .term-card{padding:26px 22px;}
  }
</style>
</head>
<body>

<header>
  <a href="./index.html" class="logo">
    <svg viewBox="0 0 40 40" fill="none"><rect x="4" y="12" width="32" height="22" rx="3" stroke="#1c1c1a" stroke-width="1.6"/><circle cx="20" cy="23" r="7" stroke="#1c1c1a" stroke-width="1.6"/><rect x="13" y="8" width="8" height="5" rx="1" stroke="#1c1c1a" stroke-width="1.6"/></svg>
    <span>
      <span class="en" id="logoLabel">Photographer</span>
      <span class="name en" id="logoName">Hazuki</span>
    </span>
  </a>
</header>

<main>
  <div class="wrap">
    <a href="./index.html#terms" class="back-link">← ホームへ戻る</a>
    <div class="eyebrow" id="termsEyebrow">TERMS</div>
    <h1 class="page-title" id="termsTitle">ご利用規約</h1>
    <div id="termsList"></div>
    <div class="cta-row">
      <a href="./index.html#contact" class="pill-btn">お問い合わせ<span class="arrow">→</span></a>
    </div>
  </div>
</main>

<script src="./data.js"></script>
<script>
async function render() {
  try {
    const c = await loadContent();
    document.getElementById('logoLabel').textContent = c.brand.logoLabel;
    document.getElementById('logoName').textContent = c.brand.nameEn;
    document.getElementById('termsEyebrow').textContent = c.sections.terms.eyebrow;
    document.getElementById('termsTitle').textContent = c.sections.terms.title;

    document.getElementById('termsList').innerHTML = (c.termsSections || []).map(t => `
      <div class="term-card">
        <div class="term-title">${escapeHtml(t.title)}</div>
        <div class="term-body">${escapeHtml(t.body)}</div>
        ${(t.rows && t.rows.length) ? `
          <table class="term-table">
            ${t.rows.map(r => `<tr><td>${escapeHtml(r.label)}</td><td>${escapeHtml(r.value)}</td></tr>`).join('')}
          </table>` : ''}
      </div>`).join('');
  } catch (e) {
    console.error(e);
  } finally {
    document.body.classList.add('ready');
  }
}

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

render();
</script>

</body>
</html>
