<style>
  html{overflow-x:hidden; max-width:100%; overscroll-behavior-x:none; touch-action:pan-y pinch-zoom;}
  body{overflow-x:clip; max-width:100%; position:relative;}
  :root{
    --paper:#ffffff;
    --mist:#f2efe8;
    --ink:#1c1c1a;
    --teal:#2b6660;
    --teal-deep:#1f4d48;
    --stone:#8d897d;
    --line:rgba(28,28,26,0.1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:400; line-height:1.9; -webkit-font-smoothing:antialiased;
    opacity:0; transition:opacity .3s ease;
  }
  body.ready{opacity:1;}
  .en{font-family:'Jost', sans-serif;}
  .mincho{font-family:'Shippori Mincho', serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1000px; margin:0 auto; padding:0 42px;}

  header{
    display:flex; align-items:center; padding:20px 42px; border-bottom:1px solid var(--line);
  }
  .logo{display:flex; align-items:center; gap:12px;}
  .logo svg{width:30px; height:30px; flex-shrink:0;}
  .logo .en{font-size:11px; letter-spacing:0.1em; color:var(--stone); display:block;}
  .logo .name{font-size:18px; font-weight:600;}

  main{padding:56px 0 100px;}
  .back-link{
    display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--stone);
    margin-bottom:30px;
  }
  .back-link:hover{color:var(--ink);}

  .eyebrow{font-family:'Jost',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.1em; color:var(--teal); margin-bottom:14px;}
  .page-title{font-size:clamp(26px,4vw,36px); font-weight:700; margin-bottom:44px;}

  .voices{display:grid; grid-template-columns:1fr; gap:18px;}
  .voice{background:var(--mist); border-radius:6px; padding:28px 34px 26px;}
  .voice p{font-size:14px; color:#4b473d; margin-bottom:16px;}
  .voice .who{font-family:'Jost',sans-serif; font-size:12.5px; font-weight:600; color:var(--stone);}

  .cta-row{margin-top:56px;}
  .pill-btn{
    display:inline-flex; align-items:center; gap:10px; background:var(--teal); color:#fff; font-weight:600;
    font-size:14px; padding:15px 30px; border-radius:100px;
  }
  .pill-btn:hover{background:var(--teal-deep);}
  .pill-btn .arrow{width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:12px;}

  .empty-state{padding:60px 0; color:var(--stone); font-size:14px;}

  @media (max-width:800px){
    .voices{grid-template-columns:1fr;}
  }
  @media (max-width:560px){
    .voice{padding:22px 20px 20px;}
    .wrap{padding:0 22px;}
    header{padding:16px 22px;}
    .voices{grid-template-columns:1fr;}
  }
</style>

/* 保存されている内容を取得。無ければデフォルトを返す */
async function loadContent() {
  try {
    if (!window.storage) throw new Error("storage unavailable");
    const result = await window.storage.get(STORAGE_KEY, true);
    if (result && result.value) {
      const saved = JSON.parse(result.value);
      // デフォルトとマージして、新しく追加された項目が欠けないようにする
      return deepMerge(structuredClone(DEFAULT_CONTENT), saved);
    }
  } catch (e) {
    console.log("保存データが見つからないため初期値を使用します", e);
  }
  return structuredClone(DEFAULT_CONTENT);
}

async function saveContent(content) {
  if (!window.storage) {
    throw new Error("この画面ではデータの保存機能が使えません（Claudeのアーティファクトとして開いた場合にのみ保存できます）");
  }
  return await window.storage.set(STORAGE_KEY, JSON.stringify(content), true);
}

function deepMerge(base, override) {
  if (Array.isArray(base)) return Array.isArray(override) ? override : base;
  if (typeof base === "object" && base !== null) {
    const out = { ...base };
    for (const k in override || {}) {
      out[k] = deepMerge(base[k], override[k]);
    }
    return out;
  }
  return override !== undefined ? override : base;
}

<script>
async function render() {
  try {
    const c = await loadContent();
    document.getElementById('logoLabel').textContent = c.brand.logoLabel;
    document.getElementById('logoName').textContent = c.brand.nameEn;
    document.getElementById('voicesEyebrow').textContent = c.sections.voices.eyebrow;
    document.getElementById('voicesTitle').textContent = c.sections.voices.title;

    const gridEl = document.getElementById('voicesGrid');
    if (!c.voices || c.voices.length === 0) {
      gridEl.outerHTML = '<div class="empty-state">まだお客様の声がありません。</div>';
    } else {
      gridEl.innerHTML = c.voices.map(v => `
        <div class="voice">
          <p>${escapeHtml(v.text)}</p>
          <div class="who en">${escapeHtml(v.who)}</div>
        </div>`).join('');
    }
  } catch (e) {
    console.error(e);
  } finally {
    document.body.classList.add('ready');
  }
}

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

render();
</script>
